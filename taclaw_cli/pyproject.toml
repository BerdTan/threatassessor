[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taclaw"
version = "0.1.0"
description = "ThreatAssessor CLI — secure-by-design threat intelligence at your fingertips"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "threatassessor-mcp>=1.1.0",
]

[project.scripts]
ta = "taclaw_cli.cli:main"
taclaw = "taclaw_cli.cli:main"

[project.urls]
Homepage = "https://github.com/breadtan88/threatassessor"
Repository = "https://github.com/breadtan88/threatassessor"

[tool.hatch.build.targets.wheel]
packages = ["taclaw_cli"]
