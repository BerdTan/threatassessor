# TMeval Phase 1 — outside-in adversarial probe cases
# Each case POSTs an adversarial MMD to the TA pipeline REST API and asserts
# on the governance_signals extracted from the SSE complete event.
#
# Fields:
#   name:             case identifier
#   file:             path relative to scripts/tmeval/
#   description:      what the adversarial element is
#   expected_rules:   DETECT rule IDs that MUST fire
#   must_not_fire:    DETECT rule IDs that must NOT fire (false-positive guards)
#   expected_blocked: true if the pipeline should halt entirely (BouncerStage)
#   tags:             domain labels for coverage matrix
#
# Coverage note: Phase 1 outside-in can only test DETERMINISTIC signals that
# fire from raw MMD content via check_input() (exploitation/sovereignty scans).
# Rules that require AI-layer signals (leakage.sensitive_keywords, arch_metadata.*
# flags like permission_escalation_detected) are covered in Phase 2 instead.

cases:
  - name: inj_external_url
    file: adversarial_corpus/inj_external_url.mmd
    description: "Component labels with embedded external URLs — triggers exploitation.external_url_references signal"
    expected_rules: [DETECT-INJ-003]
    must_not_fire: []
    tags: [INJ]

  - name: inj_path_traversal
    file: adversarial_corpus/inj_path_traversal.mmd
    description: "Path traversal sequences (../../etc/passwd) in component names — BouncerStage blocks before rule evaluation"
    expected_rules: []
    expected_blocked: true
    must_not_fire: []
    tags: [INJ]

  - name: inj_encoding_evasion
    file: adversarial_corpus/inj_encoding_evasion.mmd
    description: "Unicode homoglyph/Cyrillic lookalikes in node labels — triggers evasion_attempts signal"
    expected_rules: [DETECT-INJ-004]
    must_not_fire: []
    tags: [INJ]

  - name: exf_credential_exposure
    file: adversarial_corpus/exf_credential_exposure.mmd
    description: >
      Credential strings in architecture labels. DETECT-EXF-002 fires on leakage.sensitive_keywords
      which requires keyword=value pairs in check_artifact(ground_truth). The TA MMD parser
      mangles ["label"] syntax so credential strings do not reach the ground_truth JSON in the
      required form. Phase 2 covers this via signal injection (see phase2_cases.yaml).
      This case is a COVERAGE GAP documentation: no rules should fire here.
    expected_rules: []
    must_not_fire: []
    tags: [EXF]
    note: "AI-layer signal — not reliably triggerable from MMD labels in Phase 1; covered in Phase 2"

  - name: exf_c2_beacon
    file: adversarial_corpus/exf_c2_beacon.mmd
    description: "C2 beacon topology with cron scheduler beaconing to attacker server — triggers sovereignty.c2_beacon_nodes"
    expected_rules: [DETECT-EXF-006]
    must_not_fire: []
    tags: [EXF]

  - name: agt_permission_escalation
    file: adversarial_corpus/agt_permission_escalation.mmd
    description: >
      Agentic architecture with explicit privilege escalation pathway. BouncerStage blocks the
      pipeline on agentic architectures before rule evaluation. DETECT-AGT-003 also requires
      arch_metadata.permission_escalation_detected which is a planned but unimplemented signal.
      Pipeline block is the expected (and correct) outcome for this adversarial input.
    expected_rules: []
    expected_blocked: true
    must_not_fire: []
    tags: [AGT]
    note: "BouncerStage blocks agentic architectures; DETECT-AGT-003 signal also unimplemented — both reasons for no rule output"

  - name: agt_tool_bypass
    file: adversarial_corpus/agt_tool_bypass.mmd
    description: >
      Agent with tool restriction bypass mechanism. BouncerStage blocks the pipeline on
      agentic architectures before rule evaluation. DETECT-AGT-004 also requires
      arch_metadata.tool_restriction_bypass_detected which is a planned but unimplemented signal.
      Pipeline block is the expected (and correct) outcome for this adversarial input.
    expected_rules: []
    expected_blocked: true
    must_not_fire: []
    tags: [AGT]
    note: "BouncerStage blocks agentic architectures; DETECT-AGT-004 signal also unimplemented — both reasons for no rule output"

  - name: clean_baseline
    file: adversarial_corpus/clean_baseline.mmd
    description: "Normal 3-tier web app with proper controls — false-positive gate"
    expected_rules: []
    must_not_fire: [DETECT-INJ-003, DETECT-INJ-002, DETECT-EXF-002, DETECT-EXF-006]
    tags: [FP_CHECK]
