# model_routing.yaml — Smart pipeline mode selection thresholds
#
# Consumed by chatbot/harness/smart_router.py.
# Boxing data (report/<arch>/boxing_results.json) provides the signals.
# Updated after each new arch type is boxed.
#
# Routing tiers (evaluated in order — first match wins):
#   brain_fast  — call ta_brain_query directly, skip harness entirely
#   api_only    — deterministic engine + report, no critics
#   full_moe    — full pipeline (Analysis → Report → Critics → SM)
#
# Signal sources (from boxing_results.json .routing_signals):
#   brain_vs_gold_delta  — brain composite minus det_moe_full composite (negative = brain is below gold)
#   corpus_hits          — unique source arch IDs that drove the fired brain patterns
#   ref_technique_count  — number of validated techniques in the gold reference set

version: "1.1"
updated: "2026-09-08"

# ── Hard overrides (checked before threshold logic) ───────────────────────────
overrides:
  # High AIVSS risk — always full pipeline regardless of brain accuracy
  aivss_composite_full_moe_threshold: 7.0
  # Unknown arch (no boxing data) — default mode
  no_boxing_data_default: "api_only"
  # D5 gate: brain misses too many high-criticality techniques → force at least api_only
  d5_critical_recall_min: 0.85

# ── Tier thresholds ───────────────────────────────────────────────────────────
tiers:
  brain_fast:
    # Brain composite within 15% of gold AND enough corpus evidence
    brain_vs_gold_delta_min: -0.15   # delta must be >= this (less than 15% below gold)
    corpus_hits_min: 3               # at least 3 source archs drove the pattern

  api_only:
    # Brain exists but confidence is moderate — deterministic engine sufficient
    brain_vs_gold_delta_min: -0.30   # delta must be >= this (less than 30% below gold)
    corpus_hits_min: 1               # at least 1 corpus match

  # full_moe: everything else (delta < -0.30, corpus_hits = 0, or AIVSS override)

# ── Tested model registry ─────────────────────────────────────────────────────
# Only models from this list are eligible for routing.
# Derived from bench_results/combined_20260829_leaderboard/bench_summary.json
# status: confirmed=passed all bench runs, partial=incomplete runs, excluded=failed/timeout
tested_models:
  hetzner:
    model_id: "openai/Qwen/Qwen3.6-35B-A3B-FP8"
    status: "confirmed"
    provider: "hetzner"
    notes: "Primary provider. Best depth for agentic_ai (11.0). Best defensibility (5.38)."
  gemini_flash:
    model_id: "gemini/gemini-3.6-flash"
    status: "confirmed"
    provider: "gemini"
    notes: "Fast (200-450s). Best depth for cloud (9.7). Good breadth."
  minimax:
    model_id: "openrouter/minimax/minimax-m3:free"
    status: "excluded"
    provider: "openrouter"
    notes: "Was free tier — may have moved to paid. Do not route until re-verified. Bench scores (breadth 30-39, 128-216s) remain valid as historical reference."
  hetzner_27b:
    model_id: "openai/Qwen3.8-27B"
    status: "confirmed"
    provider: "hetzner"
    notes: "Larger Qwen variant. Good depth but slower (585-1200s)."
  nemotron_nano:
    model_id: "openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    status: "partial"
    provider: "openrouter"
    notes: "Partial bench — slow (1185-1210s). Reasoning model."
  nemotron_super:
    model_id: "openrouter/nvidia/nemotron-3-super-120b-a12b:free"
    status: "partial"
    provider: "openrouter"
    notes: "Partial bench — slow (577-1162s). Large reasoning model. Interim replacement for minimax on cloud/web_app while gemma-4-26b is evaluated."
  gemma_4_26b:
    model_id: "openrouter/google/gemma-4-26b-a4b-it:free"
    status: "partial"
    provider: "openrouter"
    notes: "Benched 2026-09-09 on cloud+web_app (azure_hub_spoke, multi_region). Blockers: blackhat silent on both arches; purple_team missing on azure. Architect -1.6pt. Token efficiency excellent (24k vs 89k). Do not route until blackhat gap resolved. Re-bench with container_orchestration if free-tier issue clears."
  # Excluded: glm (timeout/fallback), ox_alpha (timeout), gemma-4-31b (quality issues), minimax (no longer free)

# ── Model selection by arch_type ──────────────────────────────────────────────
# Derived from bench composite = 0.35*depth_norm + 0.25*defens_norm + 0.25*breadth_norm - 0.15*latency_norm
# Scores and methodology: bench_results/combined_20260829_leaderboard/bench_summary.json
#
# arch_type         | primary   | score  | fallback     | score  | note
# agentic           | minimax   | 0.732  | gemini_flash | 0.704  |
# agentic_ai        | minimax   | 0.661  | hetzner      | 0.659  | near-tie; hetzner wins on depth+defens
# cloud             | minimax   | 0.814  | gemini_flash | 0.643  |
# microservices     | minimax   | 0.807  | hetzner      | 0.679  |
# generic/web_app/  |                                             | not in bench → use defaults
# iot               |           |                                 |
model_selection:
  # full_moe: critics run — model quality matters most
  # minimax excluded (no longer free) — nemotron_super interim for breadth-heavy arches
  # gemma_4_26b: promote here once bench confirms quality (replace nemotron_super)
  full_moe:
    agentic:       { primary: hetzner,        fallback: gemini_flash }   # best depth+defens for security-critical
    agentic_ai:    { primary: hetzner,        fallback: gemini_flash }   # near-tie; hetzner wins depth+defens for AI arches
    cloud:         { primary: nemotron_super, fallback: gemini_flash }   # interim; replace with gemma_4_26b after bench
    microservices: { primary: nemotron_super, fallback: hetzner }        # interim; replace with gemma_4_26b after bench
    generic:       { primary: hetzner,        fallback: gemini_flash }
    web_app:       { primary: nemotron_super, fallback: hetzner }        # interim; replace with gemma_4_26b after bench
    iot:           { primary: gemini_flash,   fallback: hetzner }
    default:       { primary: hetzner,        fallback: gemini_flash }
  # api_only: deterministic engine + report only; speed favoured over depth
  api_only:
    default:       { primary: hetzner,        fallback: gemini_flash }

