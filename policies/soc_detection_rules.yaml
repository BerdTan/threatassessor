  #
  # Grounded in: ta-harden-audit-2026-08-14-rt01, rt02, rt03
  # OWASP: A03  ATLAS: AML.TA0001, AML.TA0002
  # Kill chain: initial_access
  # ─────────────────────────────────────────────────────────────────────────────
  - id: DETECT-031
    name: brain_training_data_poisoning
    domain: SCT
    description: >
      An architecture submitted to the analysis pipeline shows both evasion attempts and injection categories — the combined signature of a targeted attempt to smuggle malicious content through validation into the TA Brain's training data. Unlike DETECT-029 (any injection) this specifically requires evasion_attempts > 0, indicating the attacker anticipated detection and tried to circumvent it. Grounded in TA harden-audit 2026-08-14 RT-01 (gen_id path traversal), RT-02 (max_per_run abuse), RT-03 (Mermaid XSS via generated MMDs). Attack path: craft adversarial synthetic MMD → trigger generate-mmds → pass approval → poison brain instance layer → corrupt pattern predictions.
    incident_refs:
