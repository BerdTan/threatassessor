  # ─────────────────────────────────────────────────────────────────────────────
  # DETECT-032: REST Rate-Limit Abuse (Resource Exhaustion via HTTP 429 Flood)
  #
  # A caller accumulates ≥10 HTTP 429 responses against the REST API in the
  # current process lifetime. Legitimate clients back off after 1–2 rejections;
  # a script or agent hammering the API ignores 429s and keeps submitting.
  # Threshold of 10 is well above incidental retry noise (1–2) but catches
  # deliberate flooding before it degrades the pipeline for other callers.
  # Signal is cumulative (not windowed) — it resets only on API restart.
  #
  # Knowledge graph chain:
  #   HTTP[429 responses × N]
  #     └─ Counter[rate_limit_counter.get() >= 10]
  #          └─ Signal[rest_api.rate_limited_count >= 10]
  #               └─ Rule[DETECT-032]
  #
  # Provenance: TA harden-audit 2026-08-22 DETECT backlog — REST rate-limit
  # abuse attack path identified via slowapi exception handler gap.
  # ─────────────────────────────────────────────────────────────────────────────
  - id: DETECT-032
    name: rest_rate_limit_abuse
    domain: MCP
    description: >
      REST API has returned ≥10 HTTP 429 responses in the current session.
      Legitimate callers back off after 1–2 rejections. Continued submission
      despite repeated rate-limit responses indicates an automated client
      deliberately flooding the API — either to exhaust pipeline resources
      or to probe for endpoints that bypass rate limiting.
    incident_refs:
      - ta-harden-audit-2026-08-22-detect-backlog
    owasp: [A09]
    atlas_tactic: AML.TA0010
    kill_chain_stage: impact
    ocsf_class: 2004
    ocsf_type_uid: 200409
    severity: High
    conditions:
      - field: rest_api.rate_limited_count
        op: ">="
        value: 10
    combine: all
    actions:
      - type: audit_log
      - type: quarantine_trace
      - type: page_soc
    tuning_note: >
      Threshold of 10 is cumulative since last API restart. Raise to 25 if
      CI pipelines with aggressive retry logic cause false positives. Consider
      switching to a 5-minute sliding window if the API gains per-IP rate
      tracking from slowapi state.

  # ─────────────────────────────────────────────────────────────────────────────
  # DETECT-033: arch_name Path Traversal Probe
  #
  # A caller passes an arch_name containing path traversal sequences (../, ..%2F,
  # or an absolute path prefix) to the /governance/check endpoint. The API blocks
  # the traversal attempt and emits arch_metadata.path_traversal_blocked=True.
  # This distinguishes deliberate probing (DETECT-033) from accidental bad input:
  # legitimate callers never include directory separators in arch names.
  #
  # Knowledge graph chain:
  #   HTTP[POST /governance/check {arch_name: "../../etc/passwd"}]
  #     └─ Guard[is_arch_name_traversal(arch_name) = True]
  #          └─ Signal[arch_metadata.path_traversal_blocked = True]
  #               └─ Rule[DETECT-033]
  #
  # Provenance: TA harden-audit 2026-08-22 DETECT backlog — arch_name path
  # traversal gap identified in resolve_arch_dir (no traversal guard).
  # ─────────────────────────────────────────────────────────────────────────────
  - id: DETECT-033
    name: arch_name_path_traversal_probe
    domain: INJ
    description: >
      A caller submitted an arch_name containing path traversal sequences
      (../, ..%2F, or an absolute path prefix) to the governance check endpoint.
      The API blocked the attempt. Legitimate callers never include directory
      separators in architecture names — this is deliberate probing to escape the
      report directory boundary and access arbitrary filesystem paths.
    incident_refs:
      - ta-harden-audit-2026-08-22-detect-backlog
    owasp: [A01]
    atlas_tactic: AML.TA0001
    kill_chain_stage: initial_access
    ocsf_class: 2004
    ocsf_type_uid: 200406
    severity: High
    conditions:
      - field: arch_metadata.path_traversal_blocked
        op: "=="
        value: true
    combine: all
    actions:
      - type: audit_log
      - type: quarantine_trace
      - type: page_soc
    tuning_note: >
      No tuning expected — legitimate arch names never contain ../ or absolute
      paths. Any firing is a true positive by construction.

# ─────────────────────────────────────────────────────────────────────────────
playbooks:

  swing_without_reversal:
    alert: DETECT-001
    analyst_steps:
      - "Review the full critic transcript for the flagged run (Traces tab in dashboard)"
      - "Check if confidence_swing correlates with a specific node in the architecture"
      - "Look for verbalized uncertainty in critic output that was not reflected in final score"
      - "If confidence_swing > 25, escalate to DETECT-002 pattern investigation"
    escalation_threshold: 25.0
    false_positive_indicators:
      - "Architecture complexity changed significantly between runs (legitimate swing)"
      - "New architecture type with no prior baseline (first-run variance expected)"

  divergence_suppressed:
    alert: DETECT-002
    analyst_steps:
      - "Immediately quarantine the trace — do not use this analysis output"
      - "Pull the full critic transcript and score timeline from Langfuse/Traces tab"
      - "Identify which critics diverged and at what point synthesis forced convergence"
      - "Check if the architecture input itself was modified between critics (DETECT-005 co-occurrence)"
      - "Engage forensic_model (on-prem, unrestricted) for payload analysis if needed"
    escalation_threshold: 30
    note: >
      Co-occurrence of DETECT-002 and DETECT-005 in the same run is a strong indicator
      of a crafted adversarial input designed to elicit divergence then convergence.

  adversarial_input_via_pipeline:
    alert: DETECT-005
    analyst_steps:
      - "Hard stop: block_run fires automatically — no analysis output is produced"
      - "Quarantine the .mmd input file immediately"
      - "Check injection_patterns field in exploitation block for pattern category"
      - "Review governance_audit.jsonl for any prior runs of this architecture"
      - "If control tokens or zero-width chars present: treat as targeted attack, not accident"
    escalation_threshold: "any CRITICAL injection"
    note: >
      Use an on-prem open-weight model (not commercial API) to analyse the malicious .mmd
      payload — commercial safety filters may block forensic analysis of injection patterns.

  selection_pressure_reward_hacking:
    alert: DETECT-008
    analyst_steps:
      - "Review 08_scrum_master.json for critics_retriggered list and iteration count"
      - "Compare critic scores before and after retrigger — a large positive delta suggests optimisation for SM approval"
      - "Check if the same critic is repeatedly retriggered across multiple runs (cross-run pattern)"
      - "Cross-reference with DETECT-001/007 — concurrent swing signals strengthen the reward-hacking hypothesis"
      - "If redesign_signal is false and acceptance_rate < 0.4, escalate to critical incident"
    escalation_threshold: 0.4
    false_positive_indicators:
      - "Architecture has many conflicting signals across all critics (genuine disagreement, not gaming)"
      - "First ER run on a new architecture type with no prior corpus baseline"
      - "SM configuration has unusually high confidence_target (e.g. > 95%) — more retriggers expected"

  critic_module_tampering:
    alert: DETECT-016
    analyst_steps:
      - "Run `git diff chatbot/modules/agents/critics/` to identify modified files"
      - "Review the diff — determine whether the change was intentional (local dev) or injected"
      - "If injected: preserve the modified file for forensics, restore from git with `git checkout`"
      - "Check git log for recent pushes to the critics directory — confirm no unauthorised commits"
      - "Re-run the analysis after restoring clean critic files to produce a trusted output"
    escalation_threshold: "2+ critics modified → treat as coordinated supply-chain attack"
    false_positive_indicators:
      - "Local development edits not yet committed — run `git add` and commit before analysis"
      - "Container deployment without .git present — integrity check is skipped (no signal)"

  external_url_in_architecture_input:
    alert: DETECT-017
    analyst_steps:
      - "Check exploitation.external_url_list for the specific URLs embedded in the architecture"
      - "Determine whether the URLs are documentation references or live instruction sources"
      - "If live instruction sources: do not resolve — treat content at those URLs as untrusted"
      - "Request submitter to replace URLs with static node labels in the .mmd"
      - "Cross-reference with exploitation.injection_patterns — co-presence escalates to DETECT-005"
    escalation_threshold: "URL domain matches known C2 or phishing lists → escalate to CRITICAL"
    false_positive_indicators:
      - "Documentation-only URL in a comment line (%% ...) — excluded from node scanning"
      - "CI/CD pipeline embedding build artifact URLs — move to metadata, not node labels"

  high_severity_injection_category:
    alert: DETECT-019
    analyst_steps:
      - "Check exploitation.injection_categories for which HIGH-severity category matched"
      - "Review the matched text in injection_patterns — is it a legitimate phrase or a deliberate override attempt?"
      - "Cross-reference with exploitation.severity — if CRITICAL, DETECT-005 also fires and block_run should be enforced"
      - "If deliberate: flag the submitting source; request architecture resubmission with injection-free labels"
      - "If false positive (legitimate phrase): add to governance allowlist in policies/agent_governance.yaml"
    escalation_threshold: "co-present path_traversal or tag/control-token → escalate to DETECT-005/010"
    false_positive_indicators:
      - "Architecture description contains phrases like 'ignore previous errors' or 'override configuration' as legitimate node labels"
      - "Node label describes a security control (e.g. 'Bypass Prevention Service')"

  evasion_attempt_encoding_or_homoglyph:
    alert: DETECT-018
    analyst_steps:
      - "Check exploitation.homoglyph_count vs url_encoded_count to identify which evasion type"
      - "The normaliser has already neutralised the bypass — check exploitation.injection_patterns for what was found post-normalisation"
      - "If injection_patterns is also non-empty (DETECT-005 co-fires): the bypass partially succeeded before normalisation caught it — escalate"
      - "Flag the submitting source for review — this pattern does not appear in legitimate architectures"
    escalation_threshold: "co-present injection_patterns → escalate to DETECT-005/010"
    false_positive_indicators:
      - "Architecture legitimately uses non-Latin scripts for node names — add to governance allowlist"
      - "Markdown-encoded URLs in node labels — restructure to use plain text labels"

  low_technique_validation_coverage:
    alert: DETECT-014
    analyst_steps:
      - "Check validation.invalid_techniques list in governance_signals for which techniques failed"
      - "Review ground_truth.json technique_validation[] for entries with valid=false"
      - "Run ./demo_deterministic_engine.sh --validate-orphan on the architecture to surface mapping issues"
      - "Cross-reference with the architecture .mmd — invalid techniques often map to node types not present"
      - "If val_pct < 60 across multiple architectures, update self_validation.py heuristics"
    escalation_threshold: "val_pct < 60 → escalate; run /tatb-score to assess impact on overall quality"
    false_positive_indicators:
      - "Architecture has very few paths (< 5) — small denominator amplifies single invalid mapping"
      - "Novel architecture type with no self_validation coverage rules yet"

  critic_gap_convergence:
    alert: DETECT-015
    analyst_steps:
      - "Check manipulation.gap_similarity_avg and gap_similarity_max in governance_signals"
      - "Review 07_moe_orchestrator.json expert_validations — compare gap descriptions across critics"
      - "Re-run MoE with higher LLM temperature or a different model to test divergence"
      - "If convergence persists across re-runs, check for shared context or caching artifacts"
      - "Cross-reference with DETECT-008 (SM acceptance rate) — co-occurrence strengthens collusion signal"
    escalation_threshold: "gap_similarity_max > 0.7 AND DETECT-008 also fired → treat as confirmed collusion"
    false_positive_indicators:
      - "Minimal/simple architecture — all critics correctly identify the same small set of gaps"
      - "Architecture has a single dominant threat (e.g. injection-only surface) — unavoidable convergence"

  credential_exposure_in_artifact:
    alert: DETECT-009
    analyst_steps:
      - "Identify which sensitive_keywords were matched (api_key, password, token, secret)"
      - "Locate the exact field in ground_truth.json that contains the credential pattern"
      - "Determine whether the credential is real or a test placeholder — real values require immediate rotation"
      - "Quarantine the analysis output — do not share reports from this run"
      - "Remove the credential from the architecture description and re-run"
    escalation_threshold: "any NRIC or PII co-present in pii_indicators"
    false_positive_indicators:
      - "Node label contains 'API Key Service' or 'Password Manager' as a service name (not a value)"
      - "Test architecture with placeholder values like 'password=example'"

  path_traversal_in_input:
    alert: DETECT-010
    analyst_steps:
      - "Review exploitation.path_traversal list — identify the specific traversal sequence"
      - "Check whether the architecture was submitted by an external/untrusted source"
      - "Cross-reference with exploitation.injection_patterns — co-presence escalates to DETECT-005"
      - "Block the submitting account if traversal was intentional"
    escalation_threshold: "co-present injection_patterns → escalate to DETECT-005"
    false_positive_indicators:
      - "Node label contains a file path for documentation purposes (rename the node)"

  llm_external_egress_without_zdr:
    alert: DETECT-011
    analyst_steps:
      - "Review sovereignty.zdr_signals — identify which LLM node and which external service"
      - "Verify whether the destination service has an approved ZDR agreement"
      - "If ZDR agreement exists, add the service to the governance allowlist in policies/agent_governance.yaml"
      - "If no ZDR agreement: flag the architecture for compliance review before deployment"
    escalation_threshold: "co-present leakage.detected → escalate to DETECT-004"
    false_positive_indicators:
      - "Internal service with external-sounding name (e.g. 'Slack-like internal chat')"
      - "LLM node connects only to an API Gateway that enforces ZDR"

  stale_threat_intelligence_feed:
    alert: DETECT-012
    analyst_steps:
      - "Run /update-data to refresh enterprise-attack.json and technique_embeddings.npz"
      - "Re-run the analysis after data refresh to get current technique coverage"
      - "Flag all reports generated with the stale dataset as indicative-only"
    escalation_threshold: "data older than 180 days → quarantine all recent reports"
    false_positive_indicators:
      - "Intentionally pinned dataset version for reproducibility (raise threshold in governance.py)"

  high_outbound_threat_surface:
    alert: DETECT-013
    analyst_steps:
      - "Inspect aivss.outbound.metrics for which sub-scores (DS, CS) are elevated"
      - "Cross-reference with leakage.pii_indicators — PII exposure is the most common driver"
      - "Review sovereignty.cross_boundary_nodes to identify the data egress path"
      - "If DETECT-004 also fired, treat as confirmed exfiltration surface — escalate immediately"
    escalation_threshold: "composite >= 8.0 → escalate to critical, page SOC"
    false_positive_indicators:
      - "Architecture is a data analytics pipeline with legitimate PII processing under approved controls"
      - "Outbound score driven by sovereignty.cross_boundary_nodes with approved cross-region replication"

  covert_c2_channel:
    alert: DETECT-004
    analyst_steps:
      - "Identify which architecture nodes triggered sovereignty.cross_boundary_nodes"
      - "Cross-reference with leakage.pii_indicators or leakage.sensitive_keywords"
      - "Check if the exfiltration path matches a known external service (Telegram, Slack, webhook)"
      - "Review the architecture diagram for nodes with external service labels"
    escalation_threshold: "sovereignty.zdr_signals present"

  mcp_recon_sequence:
    alert: DETECT-020
    analyst_steps:
      - "Review mcp_access.recon_gov_archs — which architectures were enumerated and in what order"
      - "Check mcp_access.recon_list_calls — multiple list calls suggest automated retry loops"
      - "Cross-reference with the client's TM_API_KEY to identify the source agent or service"
      - "If followed by targeted get_threat_briefing or get_ciso_brief calls, escalate to DETECT-020+004 pattern"
      - "Block the API key if the client is not a known integration (SOC dashboard, CI gate)"
    escalation_threshold: "recon_gov_archs >= 10 in single session → treat as full corpus exfil attempt"
    false_positive_indicators:
      - "CISO dashboard loading all architectures on page load — batch all on startup, not sequential"
      - "First-time /check-mcp --live run queries all corpus archs for smoke-test"

  mcp_job_flooding:
    alert: DETECT-021
    analyst_steps:
      - "Review mcp_access.job_flood_submissions and job_flood_polls — confirm poll_ratio below threshold"
      - "Check job_store for active jobs — many queued/running with no caller polling indicates flood"
      - "Identify the API key and revoke if the caller is not a known integration"
      - "Drain the job queue: restart the API (./scripts/api/api_restart.sh) to clear in-memory store"
      - "If recurs: add rate-limit middleware to POST /api/v1/jobs/expert-review"
    escalation_threshold: "job_flood_ratio == 0.0 (zero polls) → escalate to Critical, drain queue immediately"
    false_positive_indicators:
      - "CI/CD agent submits and exits (fire-and-forget) — fix: use get_job_status(wait_for_completion=True)"
      - "Network partition between submit and poll (transient) — re-check after 5 minutes"

  mcp_auth_probing:
    alert: DETECT-022
    analyst_steps:
      - "Review mcp_access.auth_failure_count and the 5-minute window boundary"
      - "Identify the source IP or client identity from API access logs (logs/api.log)"
      - "Rotate the API_KEY in .env immediately and restart the API"
      - "Check logs for any 200 responses before the 401s — a successful probe precedes exploitation"
      - "If auth_failure_count > 20, treat as brute-force campaign — escalate to infrastructure team"
    escalation_threshold: "auth_failure_count > 20 → brute-force, block at network level"
    false_positive_indicators:
      - "Claude Desktop still has old API key in config after rotation — update claude_desktop_config.json"
      - "CI/CD secret not yet updated after key rotation — check GitHub/GitLab secret store"

  assessment_quality_regression:
    alert: DETECT-024
    analyst_steps:
      - "Check aivss.delta.composite_drop and aivss.delta.prev_composite vs curr_composite in governance_signals.json"
      - "Compare the two most recent entries in governance_signals_history.jsonl — identify which AIVSS sub-score (inbound/internal/outbound) changed most"
      - "Review the architecture .mmd for recent changes — new nodes, removed controls, or changed edge topology"
      - "Check validation.val_pct: a drop in technique coverage explains an outbound composite drop"
      - "If the drop correlates with a MITRE data refresh (/update-data), check if new techniques expanded the baseline score"
      - "If unexplained, flag for architectural review before using this assessment in a CI/CD gate"
    escalation_threshold: "composite_drop >= 5.0 → major regression, halt all gate decisions for this arch until reviewed"
    false_positive_indicators:
      - "MITRE ATT&CK data refresh added new techniques, raising the prior baseline composite — verify /update-data was run recently"
      - "SSP profile changed between runs (e.g. low_risk_cloud → high_risk_gov) — profiles weight AIVSS differently"
      - "Backfill-baseline entry had an unrealistically high composite — cross-check against actual analysis run"

  skill_instruction_tamper:
    alert: DETECT-028
    analyst_steps:
      - "Review identity.modified_skill_files — which specific skill files have diverged from git HEAD"
      - "Run `git diff .claude/skills/` to see the exact changes"
      - "Check if any modified file belongs to a core pipeline skill (check-detect, run-er, detect-loop, check-governance, aivss-gate)"
      - "If [CRITICAL] prefix present in modified_skill_files — treat as active supply-chain attack, halt pipeline immediately"
      - "Compare diff against last known good commit — look for suppressed assertions, skipped critics, or trivialised thresholds"
      - "Check git log for the committer of the last change — verify it matches expected developer identity"
      - "If modification is from active development (uncommitted edits during dev session) — commit or stash before re-running analysis"
    escalation_threshold: "modified file has [CRITICAL] prefix (core pipeline skill) → block all gate decisions, treat as supply-chain compromise"
    false_positive_indicators:
      - "Active development session — skill file edited but not yet committed. Run `git add` before analysis in dev environment."
      - "Skill update in progress — partial edit not yet committed. Expected during /tatb-loop or /detect-loop sessions."
      - "SKIP_SKILL_INTEGRITY_CHECK=1 env var suppresses in dev-only deployments"

  critic_consensus_collapse:
    alert: DETECT-026
    analyst_steps:
      - "Check sm_verdicts.acceptance_rate — what fraction of critic findings were accepted vs rejected"
      - "Review sm_verdicts per-critic breakdown — which specific critics were rejected (Blackhat? Red Team?)"
      - "Check manipulation.divergence_detected and critic_divergence_score — how far apart were the critics"
      - "Inspect the architecture for genuine complexity that would legitimately divide critics (novel agentic pattern, missing controls)"
      - "Check validation.val_pct — if below 60%, low acceptance may reflect MITRE coverage gaps, not real collapse"
      - "If acceptance_rate < 0.2 with redesign_signal, treat as untrustworthy assessment — do not use for CI/CD gating"
    escalation_threshold: "acceptance_rate < 0.2 AND redesign_signal=true → assessment invalid, block all gate decisions for this arch"
    false_positive_indicators:
      - "First run on a novel agentic architecture with low val_pct (<60%) — coverage gaps cause critic uncertainty, not real collapse"
      - "Intentional critic disagreement on a borderline design (expected divergence) — check if redesign_signal correlates with a known architectural issue"
      - "Single critic with unusually high confidence skewing the acceptance rate — check per-critic breakdown"

  downstream_agent_prompt_injection:
    alert: DETECT-027
    analyst_steps:
      - "Inspect exploitation.injection_categories.agent_targeting_injection for the matched HTML comment content"
      - "Identify which AI coding agent is targeted (Claude Code, Codex, Cursor, Copilot) from the comment text"
      - "Extract the hidden runbook — what action does it command the downstream agent to take?"
      - "Check if the payload impersonates a maintainer, CI bot, or approval authority"
      - "Quarantine the .mmd file immediately — do not pass to any AI coding agent for review"
      - "Check git history for when the comment was introduced and by whom"
      - "If RCE payload or credential harvest instructions present — treat as active attack, escalate to security team"
    escalation_threshold: "hidden runbook contains 'merge', 'approve', 'deploy', or credential harvest instructions → CRITICAL active attack"
    false_positive_indicators:
      - "Legitimate HTML comments in MMD files are very rare; a comment naming a specific AI agent is effectively never a false positive"
      - "Documentation examples showing what NOT to do — verify context before suppressing"

  c2_beacon_architecture:
    alert: DETECT-025
    analyst_steps:
      - "Review sovereignty.c2_beacon_nodes — identify the polling/scheduler node and its external receiver"
      - "Inspect the architecture diagram for cron, scheduler, or task-runner nodes and trace their outbound edges"
      - "Verify the destination label: internal metric endpoint vs external/C2/OAST receiver are very different risk levels"
      - "Check whether the polling interval or tasking source is defined — hardcoded external URLs are escalation indicators"
      - "If receiver label contains 'c2', 'oast', 'interactsh', or 'attacker' — treat as CRITICAL, block deployment immediately"
      - "Check for complementary reboot-persistence signals (crontab, registry Run key) in adjacent architecture nodes"
    escalation_threshold: "receiver node label contains 'c2', 'oast', or 'attacker' → CRITICAL, block deployment immediately"
    false_positive_indicators:
      - "Kubernetes CronJob or Airflow scheduler with named internal destination (e.g. 'Metrics DB', 'Internal API') — destination must be clearly external to fire"
      - "Health-check heartbeat to an internal load balancer or service mesh endpoint"
      - "Legitimate polling agent fetching from a named, allowlisted SaaS (e.g. 'GitHub Actions Runner → GitHub API')"

  agentic_tool_exfil_vector:
    alert: DETECT-023
    analyst_steps:
      - "Review sovereignty.cross_boundary_nodes — identify which nodes have uncontrolled outbound edges"
      - "Check aivss.outbound.composite and aivss.outbound.metrics for which sub-scores are elevated"
      - "Inspect the architecture diagram for direct internet/external egress from agent or tool-executor nodes"
      - "Verify egress controls: is there a WAF, API gateway, or egress firewall between the agent and the internet?"
      - "Check whether tool-call capabilities (CLI, shell, HTTP client) are scoped to allowlisted destinations"
      - "If cross_boundary_nodes includes 'C2Server', 'Internet', or an unnamed external node — treat as CRITICAL"
    escalation_threshold: "cross_boundary_nodes includes uncontrolled internet node AND aivss.outbound.composite >= 6.0 → escalate to CRITICAL, block deployment"
    false_positive_indicators:
      - "RAG architecture with named, trusted external knowledge source (e.g. 'Wikipedia API') — verify node label is specific, not generic 'ExternalAPI'"
      - "Architecture under active redesign — egress edges may be placeholder nodes pending control assignment"
      - "aivss.outbound.composite elevated due to data residency signals (ZDR), not tool-use egress — check aivss.outbound.metrics breakdown"

  rest_rate_limit_abuse:
    alert: DETECT-032
    analyst_steps:
      - "Check API logs for the source IP accumulating 429s: grep '429' logs/api.log | awk '{print $1}' | sort | uniq -c | sort -rn"
      - "Identify which endpoint is being flooded — analyze the URL pattern in 429 log lines"
      - "Confirm the caller is not a legitimate retry loop: check User-Agent and call intervals"
      - "If automated: block the source IP at the WAF or load balancer level"
      - "If from an internal CI pipeline: coordinate with the team to add exponential backoff"
    escalation_threshold: "rate_limited_count >= 50 within 5 minutes → escalate to CRITICAL, block IP at infrastructure level"
    false_positive_indicators:
      - "CI pipeline with aggressive retry-on-failure logic — add exponential backoff and raise threshold to 25"
      - "API restart resets the counter — high count post-restart is impossible"
      - "Development environment with rapid test iteration — consider excluding dev IPs from this rule"

  arch_name_path_traversal_probe:
    alert: DETECT-033
    analyst_steps:
      - "Extract the raw arch_name from the 400 response body or API logs to confirm the traversal payload"
      - "Check the caller IP and API key — this is always a deliberate probe, not accidental"
      - "Rotate the API key if compromised; block the source IP at WAF level"
      - "Review other requests from the same session for DETECT-020 (recon) or DETECT-010 (MMD-level traversal)"
      - "Check that resolve_arch_dir blocked the attempt and no files were accessed outside report/"
    escalation_threshold: "Any single firing → escalate immediately; no legitimate use case exists for ../  in arch_name"
    false_positive_indicators:
      - "None expected — arch names never legitimately contain path separators"

# TATB integration note
#
# TATB (TA Test Benchmark) scores across runs are a secondary detection layer:
#   - Score spike without architecture complexity increase → possible DETECT-003/006
#   - Score plateau with high coverage_pct → possible DETECT-006 (mapping not finding)
#   - Score drop with divergence signal → possible DETECT-002
#
# The TATB delta is not evaluated by this ruleset directly. It is a dashboard-level
# indicator (Insights tab) that complements these signal-level rules.
# ─────────────────────────────────────────────────────────────────────────────

