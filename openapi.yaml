          title: Critic
        description: 'Critic to run: architect | tester | red_team | purple_team |
          blackhat | scrum_master'
      - name: TM-API-KEY
        in: header
        required: false
        schema:
          type: string
          description: ThreatAssessor API key for authentication
          title: Tm-Api-Key
        description: ThreatAssessor API key for authentication
      responses:
