openapi: 3.1.0
info:
  title: ThreatAssessor API
  description: 'Architecture threat modelling — MITRE ATT&CK mapping, MoE expert review,
    SOC detection (31 DETECT rules), AIVSS scoring, TA export bundle (ta-export/1.0),
    TA Brain KG, and TACO Agent (multi-hop routing chain).


    ## Authentication

    All endpoints (except /health and /dashboard) require TM-API-KEY: <key> request
    header.


    ## Typical workflows

    - Quick assessment: POST /api/v1/analyze → full threat model + MITRE TTPs (~30s)

    - Full pipeline: analyze → POST /api/v1/jobs/expert-review → poll GET /api/v1/jobs/{id}/status

    - CI/CD gate: POST /api/v1/governance/check (50ms, no LLM) → GET /api/v1/reports/{arch}/export
    → check gate.result

    - TACO query: POST /api/v1/taco/run-sync → HopChain (brain → workspace → harness
    routing)

    - Brain query: POST /api/v1/brain/query → pattern predictions with confidence

    - MCP: python -m mcp_server.server (stdio) or --transport streamable-http for
    remote agents'
  version: 2.7.0
  contact:
    name: ThreatAssessor
    url: http://localhost:8000/dashboard
  license:
    name: Proprietary
  x-mcp-server:
    stdio: python -m mcp_server.server
    streamable-http: python -m mcp_server.server --transport streamable-http
    tools: 17
paths:
  /health:
    get:
      tags:
      - health
      summary: Health check
      description: System health status check. No authentication required.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/analyze:
    post:
      tags:
      - analysis
      summary: Analyze architecture diagram
      description: 'Run deterministic threat analysis (Team 1: ThreatAnalysisService).


        **Expected Performance:**

        - Response time: ~30 seconds (P50), ~45 seconds (P95)

        - Timeout: 120 seconds


        **Confidence Level:**

        - Base confidence: 99.5% (deterministic engine)

        - Includes: RAPIDS assessment, attack paths, control recommendations


        **Dependencies:**

        - ✅ **No prerequisites** - This is the entry point

        - Generates: `ground_truth.json` in `report/{arch_name}/` directory


        **Output Files:**

        - `report/{arch_name}/ground_truth.json` - Analysis results (used by /validate)

        - `report/{arch_name}/01_executive_summary.md`

        - `report/{arch_name}/02_technical_report.md`

        - `report/{arch_name}/03_action_plan.md`


        **Use Cases:**

        - Initial threat assessment

        - Quick architecture review

        - CI/CD pipeline integration

        - Entry point for two-step workflow (analyze → validate)'
      operationId: analyze_architecture_api_v1_analyze_post
      parameters:
      - name: include_validation
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Validation
      - name: TM-API-KEY
        in: header
        required: false
        schema:
          type: string
          description: ThreatAssessor API key for authentication
          title: Tm-Api-Key
        description: ThreatAssessor API key for authentication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_analyze_architecture_api_v1_analyze_post'
      responses:
        '200':
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Invalid file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid Mermaid syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /dashboard:
    get:
      tags:
      - dashboard
      summary: Dashboard
      description: Serve the ThreatAssessor dashboard UI with cache busting.
      operationId: dashboard_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /:
    get:
      tags:
      - dashboard
      summary: Root
      description: Redirect root to dashboard.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /api/v1/analyze-stream:
    post:
      tags:
      - streaming
      summary: Analyze Architecture Stream
      description: "Analyze architecture with real-time SSE progress updates.\n\n\
        **SSE Events:**\n- `progress`: Stage updates with percentage and ETA\n- `patterns_detected`:\
        \ Threat patterns applied (RAPIDS, AI/ML, etc.)\n- `threat_scores`: Threat\
        \ scores grouped by pattern\n- `attack_path`: Attack path discovery (streamed\
        \ as found)\n- `complete`: Final analysis result\n- `error`: Error occurred\n\
        \n**Progress Stages:**\n1. Parsing (0-10%)\n2. MITRE Cache Loading (10-20%)\n\
        3. RAPIDS Analysis (20-60%)\n4. AI/ML Analysis (60-80%, if detected)\n5. Validation\
        \ (80-100%)\n\n**Example Client (JavaScript):**\n```javascript\nconst eventSource\
        \ = new EventSource('/api/v1/analyze-stream');\n\neventSource.addEventListener('progress',\
        \ (e) => {\n  const data = JSON.parse(e.data);\n  updateProgressBar(data.progress);\n\
        \  updateStatusMessage(data.message);\n});\n\neventSource.addEventListener('complete',\
        \ (e) => {\n  const result = JSON.parse(e.data);\n  displayResults(result);\n\
        \  eventSource.close();\n});\n```\n\n**Example Client (Python):**\n```python\n\
        import requests\n\nresponse = requests.post(\n    'http://localhost:8000/api/v1/analyze-stream',\n\
        \    headers={'TM-API-KEY': 'your-key'},\n    files={'architecture_file':\
        \ open('arch.mmd', 'rb')},\n    stream=True\n)\n\nfor line in response.iter_lines():\n\
        \    if line.startswith(b'data: '):\n        data = json.loads(line[6:])\n\
        \        print(f\"Progress: {data['progress']}% - {data['message']}\")\n```"
      operationId: analyze_architecture_stream_api_v1_analyze_stream_post
      parameters:
      - name: TM-API-KEY
        in: header
        required: false
        schema:
          type: string
          description: ThreatAssessor API key for authentication
          title: Tm-Api-Key
        description: ThreatAssessor API key for authentication
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_analyze_architecture_stream_api_v1_analyze_stream_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /api/v1/expert-review:
    get:
      tags:
      - streaming
      summary: Expert Review Stream
      description: "Run MoE Expert Review on a previously analyzed architecture.\n\
        \nStreams real-time progress via SSE as critics validate the deterministic\n\
        analysis and produce a consensus confidence score and unified recommendations.\n\
        Which critics run (blackhat, purple_team) is controlled by server configuration.\n\
        \n**Prerequisites:** Run `/api/v1/analyze-stream` first to generate `ground_truth.json`.\n\
        \n**SSE Events:**\n- `progress`: Stage updates (architect → tester → red_team\
        \ → [purple_team] → [blackhat] → synthesis)\n- `critic_result`: Emitted as\
        \ each critic finishes — includes score, status, gap count, top gaps\n- `complete`:\
        \ Final MoEResult with confidence and consensus recommendations\n- `error`:\
        \ Error details (e.g. missing prerequisites)\n\n**Example Client (JavaScript):**\n\
        ```javascript\nconst url = `/api/v1/expert-review?architecture_name=${archName}`;\n\
        const es = new EventSource(url);\n\nes.addEventListener('progress', (e) =>\
        \ {\n  const d = JSON.parse(e.data);\n  console.log(`${d.message} (${d.progress}%)`);\n\
        });\n\nes.addEventListener('complete', (e) => {\n  const result = JSON.parse(e.data);\n\
        \  console.log('Final confidence:', result.confidence.final);\n  es.close();\n\
        });\n```"
      operationId: expert_review_stream_api_v1_expert_review_get
      parameters:
      - name: architecture_name
        in: query
        required: true
        schema:
          type: string
          description: Architecture name (must match an existing analysis in report/)
          title: Architecture Name
        description: Architecture name (must match an existing analysis in report/)
      - name: critic_mode
        in: query
        required: false
        schema:
          type: string
          description: 'Critic execution mode: sequential | parallel | auto'
          default: sequential
          title: Critic Mode
        description: 'Critic execution mode: sequential | parallel | auto'
      - name: TM-API-KEY
        in: header
        required: false
        schema:
          type: string
          description: ThreatAssessor API key for authentication
          title: Tm-Api-Key
        description: ThreatAssessor API key for authentication
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /api/v1/run-critic:
    get:
