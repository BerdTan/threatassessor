# ThreatAssessor — operator settings
#
# Load order: Python defaults → this file → user_config.json (gitignored, personal overrides)
#
# LLM provider and model selection is driven by agentic/providers.py (PROVIDER_MANIFEST).
# Set LLM_PROVIDER in .env to switch all agents between providers in one place.
# ${VAR} placeholders are resolved from environment at startup; unset vars become "".

# ---------------------------------------------------------------------------
# Embedding model (MITRE technique similarity search)
# ---------------------------------------------------------------------------
embedding:
  provider: "openrouter"
  model: "nvidia/llama-nemotron-embed-vl-1b-v2:free"
  dimensions: 2048

# ---------------------------------------------------------------------------
# Per-agent model overrides (HarnessModelGuardian is the sole broker)
#
# Default (env var unset): agent inherits LLM_PROVIDER's manifest default.
# Override per-agent by setting the env var — useful for mixed-model experiments
# (e.g. architect on hetzner, blackhat on gemini) or cross-model benchmarking.
# All agents in a bench batch use the same model via PipelineRequest.agent_models.
# ---------------------------------------------------------------------------
agent_models:
  architect:        {model: "${AGENT_MODEL_ARCHITECT}"}
  tester:           {model: "${AGENT_MODEL_TESTER}"}
  red_team:         {model: "${AGENT_MODEL_RED_TEAM}"}
  purple_team:      {model: "${AGENT_MODEL_PURPLE_TEAM}"}
  blackhat:         {model: "${AGENT_MODEL_BLACKHAT}"}
  scrum_master:     {model: "${AGENT_MODEL_SCRUM_MASTER}"}
  moe_orchestrator: {model: "${AGENT_MODEL_MOE}"}
  threat_analyst:   {model: "${AGENT_MODEL_THREAT_ANALYST}"}
  ta_wiz:           {model: "${AGENT_MODEL_TA_WIZ}"}
  event_detector:   {model: "${AGENT_MODEL_EVENT_DETECTOR}"}
  tatb_labeller:    {model: "${AGENT_MODEL_TATB_LABELLER}", fallbacks: ["${AGENT_MODEL_TATB_LABELLER_FALLBACK}"]}

# ---------------------------------------------------------------------------
# TACO companion agent
# ---------------------------------------------------------------------------
taco:
  confidence_threshold: 0.65
  aivss_drop_alert_threshold: 0.15
  rag_enabled: true
  # critic_enabled gates TACOminiCritic registration.
  # Even when true, the critic only runs when force_critic=true in the request.
  critic_enabled: false
  # critic is the only TACO mini that calls an LLM; set AGENT_MODEL_TACO_CRITIC to override.
  # brain/harness/rag are deterministic — their model slots are reserved for future use.
  mini_models:
    critic: "${AGENT_MODEL_TACO_CRITIC}"
